services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093

      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092

  postgres:
    image: ankane/pgvector:latest
    container_name: changeowl-db
    ports:
      - "5432:5432"
    env_file: ../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d changeowl"]
      interval: 5s
      timeout: 5s
      retries: 5

  github-ingestion-service:
    container_name: github-ingestion-service
    build:
      context: ..
      dockerfile: services/github-ingestion-service/Dockerfile
    env_file: ../.env
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - kafka

  storage-service:
    container_name: storage-service
    build:
      context: ..
      dockerfile: services/storage-service/Dockerfile
    env_file: ../.env
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - kafka

  semantic-enrichment-service:
    container_name: semantic-enrichment-service
    build:
      context: ../services/semantic-enrichment-service
      dockerfile: ./Dockerfile
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file: ../services/semantic-enrichment-service/.env
    ports:
      - "8050:8050"


  artifact-gateway-service:
    container_name: artifact-gateway-service
    build:
      context: ..
      dockerfile: services/artifact-gateway-service/Dockerfile
    env_file: ../services/artifact-gateway-service/.env
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - kafka

  changeowl-web:
    container_name: changeowl-web
    build:
      context: ../services/changeowl-web
      dockerfile: ./Dockerfile
    env_file: ../services/changeowl-web/.env
    ports:
      - "3000:3000"
    depends_on:
      - semantic-enrichment-service
      - artifact-gateway-service

  agent-service:
    container_name: agent-service
    build:
      context: ../services/agent-service
      dockerfile: ./Dockerfile
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    env_file: ../services/agent-service/.env
    ports:
      - "8052:8052"

volumes:
  postgres_data: